name: Update movies & deploy

# Builds fresh movie data from TMDB and publishes the site to GitHub Pages.
# The data is generated on every run and deployed directly — it is not committed.
on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch movies from TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Add a TMDB_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          node scripts/update-movies.mjs

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js tickets.js movies.js data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
