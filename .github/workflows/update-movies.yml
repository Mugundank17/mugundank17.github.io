name: Update movies & deploy

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches-ignore:
      - "gh-pages"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: movies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch movies from TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::Add a TMDB_TOKEN repository secret to fetch movie data automatically."
          else
            node scripts/update-movies.mjs
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update movie data from TMDB"
            git push
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html style.css app.js movies.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
