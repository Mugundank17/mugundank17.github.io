<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Movie Countdown</title>
  <meta name="description" content="Live countdowns to the biggest upcoming movie releases.">
  <meta name="theme-color" content="#060606">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav" id="nav">
    <a class="brand" href="#/">MOVIE<span>COUNTDOWN</span></a>
    <div class="nav-links">
      <a href="#/" data-scroll="row-upcoming">Coming Soon</a>
      <a href="#/" data-scroll="row-out">Out Now</a>
    </div>
    <button class="btn btn-solid btn-sm" id="addBtn" type="button">+ Add</button>
  </nav>

  <main id="app"></main>

  <footer class="footer">
    <p>Release dates change often — always check with your local cinema.</p>
    <p class="muted">Movie Countdown · a fan-made site</p>
  </footer>

  <!-- Trailer modal -->
  <dialog id="trailer" class="trailer">
    <button class="close" type="button" aria-label="Close trailer">✕</button>
    <div class="video"></div>
  </dialog>

  <!-- Add movie -->
  <dialog id="addDialog" class="form-dialog">
    <form id="addForm">
      <h2>Add a countdown</h2>
      <label>Title <input name="title" required maxlength="60" autocomplete="off"></label>
      <div class="pair">
        <label>Release date <input name="date" type="date" required></label>
        <label>Colour <input name="color" type="color" value="#ff6a00"></label>
      </div>
      <label>Director (optional) <input name="director" maxlength="60"></label>
      <label>Tagline (optional) <input name="tagline" maxlength="80"></label>
      <label>Image URL (optional) <input name="image" type="url" placeholder="https://…"></label>
      <div class="actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-solid">Save</button>
      </div>
      <p class="muted small">Saved only in this browser.</p>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
